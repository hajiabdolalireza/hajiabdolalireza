name: Todoist Readme

on:
  workflow_dispatch:
  schedule:
    
    - cron: "0 */12 * * *"

permissions:
  contents: write   

jobs:
  update-readme:
    name: Update todoist stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: b00y0h/todoist-readme-v2@12dbb8595fffd79ae454d16d97f8c62998d05d57 # v2.0.2
        with:
          TODOIST_API_KEY: ${{ secrets.TODOIST_API_KEY }}
          # PREMIUM: "true"
