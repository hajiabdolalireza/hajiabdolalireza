name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # روزی یک‌بار
  workflow_dispatch:        # اجرای دستی

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # لازم برای commit خروجی
    steps:
      - name: Load pinned Metrics container
        run: |
          docker pull ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65
          docker tag ghcr.io/lowlighter/metrics@sha256:257392f90340f916cb8b815026f259399f6b246d3eb7de38b58bfe7a07bd5b65 metrics:3.34.0
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # 3.34.0
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          use_prebuilt_image: no

          # تنظیمات اصلی برای "My GitHub Data"
          user: hajiabdolalireza
          template: classic
          base: header, repositories, metadata   # بخش‌های لازم برای دیتای پروفایل
          config_timezone: Asia/Tehran

          # جمله‌ی "From Hello World I've Written ..."
          plugin_lines: yes
          plugin_lines_delay: 30                 # کمک می‌کند اولین کوئری پایدار شود

          # (اختیاری) اگر می‌خوای ریپوهای عضو/همکار هم حساب شوند:
          repositories_affiliations: owner, collaborator, organization_member
